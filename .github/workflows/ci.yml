name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: 06_src/requirements.lock

      - name: Install pinned dependencies
        working-directory: 06_src
        run: pip install -r requirements.lock

      # Before pytest: without the corpus the 18 Layer A tests skip instead of running.
      - name: Build the retrieval corpus
        working-directory: 06_src
        run: python -c "from bail_reckoner.retrieval.corpus import build_corpus; print(len(build_corpus()[0]))"

      - name: Lint
        working-directory: 06_src
        run: ruff check .

      - name: Types
        working-directory: 06_src
        run: mypy bail_reckoner

      - name: Tests
        working-directory: 06_src
        run: pytest -q
