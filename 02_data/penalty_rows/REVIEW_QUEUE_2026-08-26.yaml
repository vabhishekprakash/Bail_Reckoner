    verified_by: 'model-draft (unverified)'
    extractor_output_do_not_rely_on: "307. Attempt to murder.—Whoever does any act with such intention or knowledge, and under such circumstances that, if he by that act caused death, he would be guilty of murder, shal l be punished with imprisonment of either description for a term which may extend to ten years, and sha ll also be liable to fine; and if hurt is caused to any person by such act, the offender shall be liab le either to 1[imprisonment for life], or to such punishment as is hereinbefore mentioned. Attempts by life-convicts .—2[When any person offending under this section is under sentence of 1[imprisonment for life], he may, if hurt is caused, be punished with death.] Illustrations (a) A shoots at Z with intention to kill him, under such circumstances that, if death ensued, A would be guilty of murder. A is liable to punishment under this section. (b) A, with the intention of causing the death of a child of tend er years, exposes it in a desert place. A has committed the offence defined by this section, though the death of the child does not ensue. (c) A, intending to murder Z, buys a gun and loads it. A has not yet c ommitted the offence. A fires the gun at Z. He has committed the offence defined in this section, and, if by such firi ng he wounds Z, he is liable to the punishment provided by the latter part of 3[the first paragraph of] this section. (d) A, intending to murder Z by poison, purchases poison and mixes the same with food which remains in A's keeping; A has not yet committed the offence defined in this section. A places the food on Z's table or delivers it to Z's servants to place it on Z's table. A has committed the offence defined in this section."

