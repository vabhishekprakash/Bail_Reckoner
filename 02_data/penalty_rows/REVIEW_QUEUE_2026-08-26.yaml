  # ── BNS_2023-109 · Attempt to murder · 3 limb(s)
  - offence_id: 'BNS_2023-109#L1'
    priority: false
    label: 'Attempt to murder'
    regime: BNS_2023
    section: '109'
    variant: 'L1'   # REVIEWER: rename to the limb as printed
    counterpart_id: 'IPC_1860-307'
    maximum: null            # REVIEWER: set from the PAGE
    min_term_months: null    # REVIEWER: only if the limb prescribes one
    compoundable: null       # not this pass (D-036 vi)
    status: DRAFT
    definition_punishment_split: false
    state_amendment_present: false
    source: 'BNS_2023_Act45_Gazette_2023-12-25_MHA.pdf'
    READ_THIS_PAGE: 'BNS_2023_Act45_Gazette_2023-12-25_MHA.pdf, printed p. 34 (PDF page index 33), s.109'
    verified_by: 'model-draft (unverified)'
    extractor_output_do_not_rely_on: '109.(1) Whoever does any act with such intention or knowledge, and under such circumstances that, if he by that act caused death, he would be guilty of murder, shall be punished with imprisonment of either description for a term which may extend to ten years, and shall also be liable to fine; and if hurt is caused to any person by such act, the offender shall be liable either to imprisonment for life, or to such punishment as is hereinbefore mentioned. Culpable homicide by causing death of person other than person whose death was intended. Punishment for murder. Punishment for murder by life-convict. Punishment for culpable homicide not amounting to murder. Causing death by negligence. Abetment of suicide of child or person of unsound mind. Abetment of suicide. Attempt to murder. 30 of 2019. 34 THE GAZETTE OF INDIA EXTRAORDINARY [Part II—_____________________________________________________________________________________________________________________________________________________________________________________________________________________________________________________________________________________________________________________________________________________________________ (2) When any person offending under sub-section (1) is under sentence of imprisonment for life, he may, if hurt is caused, be punished with death or with imprisonment for life, which shall mean the remainder of that person’s natural life. Illustrations. (a) A shoots at Z with intention to kill him, under such circumstances that, if death ensued, A would be guilty of murder. A is liable to punishment under this section. (b) A, with the intention of causing the death of a child of tender years, exposes it in a desert place. A has committed the offence defined by this section, though the death of the child does not ensue. (c) A, intending to murder Z, buys a gun and loads it. A has not yet committed the offence. A fires the gun at Z. He has committed the offence defined in this section, and, if by such firing he wounds Z, he is liable to the punishment provided by the latter part of sub-section (1). (d) A, intending to murder Z by poison, purchases poison and mixes the same with food which remains in A ’s keeping; A has not yet committed the offence defined in this section. A places the food on Z’s table or delivers it to Z’s servants to place it on Z’s table. A has committed the offence defined in this section.'

