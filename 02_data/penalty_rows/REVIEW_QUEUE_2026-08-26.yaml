#   detector estimate — which is what the review protocol already demands: the page
#   governs, and rows are added or deleted to match it.
#
# ORDER — sanity-pass first, per the review protocol:
#   PART 1 — SANITY PASS (5 rows). IPC 304A and IPC 379 carry inline STATE AMENDMENTS
#            blocks (L-002): the Himachal Pradesh apparatus after s.304A contains a LIFE
#            clause that belongs to no charged offence — if the sheet ever tempts you to
