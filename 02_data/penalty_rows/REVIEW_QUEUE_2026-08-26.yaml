#   changed the limb detector — the prose rule "or with imprisonment" was over-counting
#   an ALTERNATIVE WITHIN one limb ("...life, or with imprisonment...") as a second limb,
#   and the fix subtracts that false-positive pattern, removing exactly one limb each
#   from BNS ss.331, 316, 317 and 351. That mechanical cause is established. The same
