#            quantity bands, of which the commercial band prescribes 10-20 years.
#   PART 2 — PRIORITY (54 rows): the remaining 20 priority seed sections, multi-limb
#            first with limbs adjacent in text order, then NDPS ss.21 and 22.
#   PART 3 — REMAINING (27 rows): the non-priority seed sections.
#
# HOW TO SIGN A ROW (the whole action, per row):
#   1. OPEN the PDF named in READ_THIS_PAGE at the page given there and read the limb
#      as printed. Page references come in two kinds, named per row: "printed p. N" is
#      the number printed on the page itself; "PDF page index N" is ZERO-BASED, so in a
#      viewer whose page box counts from 1, TYPE N+1. (Verified empirically 2026-08-29:
#      the NDPS row's "printed p. 16" sits at 0-based index 15, i.e. viewer page 16.
#      An earlier version of this header said the index was the 1-based viewer number —
#      that was wrong by one page and is the sixth-instance audit's finding A-1.)
#      Where the printed number is unknown the PDF index is always given — 24 seed rows
#      are in that state.
#   2. Set `maximum` from what the PAGE says: kinds (DEATH/LIFE/TERM/FINE_ONLY/
#      BY_REFERENCE), term_months for a definite term, fine_also.
#   3. Set `min_term_months` ONLY where the limb prescribes a mandatory minimum;
#      otherwise leave null. Feeds no gate; shown for honesty.
#   4. Rename `variant` from the detector label to the statutory limb as printed
#      ('(2)', '(4)', 'Part II', 'commercial_quantity'...) and update `offence_id` to
#      match (it must end '#<variant>').
#   5. If the page shows more limbs than rows, add rows; fewer, delete rows. The limb
#      count is a DETECTOR ESTIMATE; the page governs.
#   6. Put your name in `verified_by`, the date in `verified_on`, set `status: VERIFIED`.
#
# WHY THE PAGE AND NOT THE EXTRACTOR OUTPUT — the point of the whole review: the
# extractor output is the machine's belief and you are the independent channel. Its
# documented failures include truncating at page breaks, over-running into the next
# section, missing amendment-inserted sections, mis-reading page numbers, and counting
